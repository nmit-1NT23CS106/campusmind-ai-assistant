# docker compose up --build      then open http://localhost:8501
services:
  api:
    build: .
    image: campusmind:latest
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./logs:/app/data/logs"]
  ui:
    image: campusmind:latest
    command: streamlit run ui/chat.py --server.port 8501 --server.address 0.0.0.0
    env_file: .env
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
